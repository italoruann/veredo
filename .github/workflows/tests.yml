name: tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # PySide6 em modo "offscreen" (usado pelo smoke test da GUI) precisa dessas libs no
      # Linux; no runner do Windows o Qt já traz tudo que precisa.
      - name: Instala dependências de sistema do Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      # Usa o Python fixado em .python-version (baixado pelo uv se o runner não tiver) e falha se
      # o uv.lock estiver desatualizado em relação ao pyproject.toml.
      - name: Instala dependências Python
        run: uv sync --locked

      - name: Roda a suíte de testes
        run: uv run pytest tests/ -v
